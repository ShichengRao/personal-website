[build]
publish = "public"
command = "hugo"

[build.environment]
HUGO_VERSION = "0.150.0"
HUGO_ENABLEGITINFO = "true"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000"
# microphone stays enabled for the Hangul practice recorder
Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"

# Scrabble Mod games live at /scrabble-mod/<three-word-id>; the page reads the
# id from the path. Real files under /scrabble-mod/ still win (force is off).
[[redirects]]
from = "/scrabble-mod/*"
to = "/scrabble-mod/"
status = 200

# The resume PDF used to carry a year in its filename.
[[redirects]]
from = "/files/ShichengRaoResume2025.pdf"
to = "/files/ShichengRaoResume.pdf"
status = 301

# These paths used to be on-site stub pages that bounced visitors
# elsewhere; real 301s keep old inbound links working.
[[redirects]]
from = "/church/*"
to = "https://www.harvest-nyc.com/"
status = 301

[[redirects]]
from = "/vine/*"
to = "https://vine-learning-app.vercel.app/vine-app"
status = 301

[[redirects]]
from = "/deskbooks/*"
to = "https://deskbooks-demo.vercel.app"
status = 301

# The livestream now lives on harvest-nyc.com itself.
[[redirects]]
from = "/livestream/*"
to = "https://www.harvest-nyc.com/"
status = 301
