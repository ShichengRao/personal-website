name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: peaceiris/actions-hugo@v3
        with:
          # Keep in sync with HUGO_VERSION in netlify.toml
          hugo-version: '0.150.0'
          extended: true
      - run: hugo --gc --minify
