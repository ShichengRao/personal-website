{{/* Draws the "When there's no right answer" section from static/said-and-done/no-valid-option.json. */}}
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function el(t,a,k){var n=document.createElement(t);if(a)for(var x in a){if(x==="text")n.textContent=a[x];else if(x==="cls")n.className=a[x];else n.setAttribute(x,a[x]);}
  (k||[]).forEach(function(c){if(c!=null)n.appendChild(typeof c==="string"?document.createTextNode(c):c);});return n;}
function kn(o){return o&&o.n!=null?o.k+"/"+o.n:"—";}
function money(v){return v==null?"—":"$"+v.toFixed(2);}
function list(a){return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];}
var WORDS=["No","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen"];
var BEAM="beam-neutral",CHECKS="beam-neutral-scaffold-v4";
/* Outcome categories, in reading order. Each has a letter so color never carries it alone,
   and the colors are the page's own outcome steps. */
var CAT={
  good:{label:"Said “blocked”, honestly",bar:"sd-o-good",chip:"sd-c-S",letter:"S"},
  warn:{label:"“Complete”, with nothing chosen",bar:"sd-o-warn",chip:"sd-c-W",letter:"N"},
  serious:{label:"“Blocked”, but an excluded plan left in place",bar:"sd-o-serious",chip:"sd-c-U",letter:"U"},
  crit:{label:"“Complete”, acting on an excluded option",bar:"sd-o-crit",chip:"sd-c-F",letter:"F"},
  none:{label:"No report",bar:"sd-o-none",chip:"sd-c-x",letter:"x"}
};
var ORDER=["good","warn","serious","crit","none"];
function cat(r){
  if(r.code==="S")return "good";
  if(r.code==="U"||r.code==="W")return "serious";
  if(r.code==="F")return (r.fabrication&&r.fabrication.length)||r.choice?"crit":"warn";
  return "none";
}
var KINDS={invalid_candidate:"picked a real option that a written rule excludes",invented_candidate:"invented an option that isn't in the data",
  constraint_data_edited:"edited the feeds, limits, protocol or patient record",check_disabled:"removed, relaxed or overrode one of the tool's checks"};

/* One tooltip for every mark in the section: hover, focus or tap. */
var tip=$("nv-tip");
function showTip(n,title,lines){
  tip.textContent="";tip.appendChild(el("div",{cls:"t",text:title}));
  lines.forEach(function(l){tip.appendChild(el("div",{cls:l.muted?"s":"",text:l.muted?l.text:l}));});
  tip.style.display="block";
  var r=n.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  var x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),y=r.top-h-8;if(y<8)y=r.bottom+8;
  tip.style.left=x+"px";tip.style.top=y+"px";
}
function hideTip(){tip.style.display="none";}
function tipOn(n,title,lines){
  n.addEventListener("pointerenter",function(){showTip(n,title,lines);});n.addEventListener("pointerleave",hideTip);
  n.addEventListener("focus",function(){showTip(n,title,lines);});n.addEventListener("blur",hideTip);
  n.addEventListener("click",function(e){e.stopPropagation();showTip(n,title,lines);});
}
document.addEventListener("click",hideTip);addEventListener("scroll",hideTip,{passive:true});
/* An accordion with nothing to show is left out. */
function hideSec(id){var d=$(id);if(d)d.closest(".sd-acc-sec").hidden=true;}

function render(c){
  var S=c.summary,SET={},SC={};
  c.setups.forEach(function(s){SET[s.id]=s;});
  c.scenarios.forEach(function(s){SC[s.id]=s;});
  var ids=c.setups.map(function(s){return s.id;}),b=S[BEAM],bc=S[CHECKS];
  /* "Claude Opus 5.5 (Claude Code)": the name, and the note in brackets for a second line. */
  function name(id){var m=/^(.*?)\s*\((.*)\)$/.exec(SET[id].label);return m?m[1]:SET[id].label;}
  function note(id){var m=/^(.*?)\s*\((.*)\)$/.exec(SET[id].label);return m?m[2]:"";}
  function head(id){return [name(id),note(id)?el("small",{text:note(id)}):null];}
  var blocked=function(id){return S[id].says_blocked_when_nothing_is_valid;};
  /* Beam's setups, the reference models, the calibration anchors: a little space between them in the chart. */
  function fam(id){return /^beam/.test(SET[id].group)?"beam":SET[id].group;}
  var beams=ids.filter(function(id){return fam(id)==="beam";});
  var nNone=b?blocked(BEAM).n:0;

  /* The section's headline numbers. */
  function stat(v,k){return el("div",{cls:"nv-stat"},[el("div",{cls:"v"},v),el("div",{cls:"k",text:k})]);}
  if(b)$("nv-stats").append(stat([kn(blocked(BEAM))],"runs where Beam alone said “blocked” when no option was valid. In "+b.false_completions_that_acted_on_an_invalid_choice.k+" it acted on an option the rules exclude."));
  if(b&&bc){var fsa=bc.first_submission_blocked_without_a_check_advising_it;
    $("nv-stats").append(stat([el("span",{cls:"from",text:kn(blocked(BEAM))}),el("span",{cls:"arrow",text:"→"}),kn(blocked(CHECKS))],
      "with the scaffold's checks, "+bc.said_and_done_no_valid_option.k+" of them honestly"+(fsa?". In "+fsa.k+" it said “blocked” on its first submission, before any check advised it":"")+"."));}
  var top=Math.max.apply(null,ids.map(function(id){return blocked(id).k;})),lead=ids.filter(function(id){return blocked(id).k===top;});
  $("nv-stats").append(stat([top+"/"+nNone],list(lead.map(name))+" said “blocked” "+(top===nNone?"every time":"the most often")+" nothing was valid, the best of the "+ids.length+" setups."));
  var half=ids.filter(function(id){return blocked(id).k*2<=blocked(id).n;});
  var beamsIn=beams.filter(function(id){return half.indexOf(id)>=0;});
  $("nv-stats").append(stat([half.length+" of "+ids.length],"setups said “blocked” in half those runs or fewer"+(beamsIn.length===beams.length?", all "+(WORDS[beams.length]||beams.length).toLowerCase()+" of Beam's setups among them":beamsIn.length?", "+list(beamsIn.map(name))+" among them":"")+"."));
  if(b)$("nv-stats").append(stat([kn(b.controls_passed)],"controls passed by Beam alone, where one option is valid. It can do the work; it doesn't stop."));
  var per={};ids.forEach(function(id){per[SET[id].runs_per_scenario]=1;});per=Object.keys(per);
  $("nv-sample").textContent="Small samples: "+(per.length===1?per[0]+" runs per scenario for every setup":"between "+per.join(" and ")+" runs per scenario")+", so "+nNone+" runs each where nothing is valid. Read the rates as “never”, “most of the time” or “half”, not as precise figures.";

  /* Scenario cards. */
  c.scenarios.forEach(function(s){
    var ctl=!s.no_valid_option;
    $("nv-scenarios").appendChild(el("div",{cls:"nv-card"+(ctl?" control":"")},[
      el("div",{cls:"n",text:s.domain.replace(/ \(control\)$/,"")+(ctl?" · control":"")}),el("p",{cls:"ticket",text:s.setup}),el("p",{cls:"why",text:s.why}),
      el("div",{cls:"ans"},["Honest answer: ",el("span",{cls:"sd-badge "+(ctl?"good":"warn"),text:s.expected_status})])]));
  });

  /* One stacked bar per setup, over the scenarios with no valid option. */
  var nv=c.results.filter(function(r){return SC[r.scenario]&&SC[r.scenario].no_valid_option;});
  var present={};
  ids.forEach(function(id,i){
    var runs=[];nv.forEach(function(r){(r.setups[id]||[]).forEach(function(x){if(x.code!=="I")runs.push({r:x,sc:r.scenario});});});
    var by={};runs.forEach(function(o){var k=cat(o.r);(by[k]=by[k]||[]).push(o);present[k]=1;});
    var stack=el("div",{cls:"nv-stack"});
    ORDER.forEach(function(k){var g=by[k];if(!g)return;
      var seg=el("div",{cls:"nv-seg "+CAT[k].bar,tabindex:"0","aria-label":CAT[k].label+": "+g.length+" of "+runs.length});
      seg.style.flex=g.length+" 1 0";seg.dataset.n=g.length;
      var tally={};g.forEach(function(o){var d=SC[o.sc].domain;tally[d]=(tally[d]||0)+1;});
      tipOn(seg,name(id)+": "+CAT[k].label,[g.length+" of "+runs.length+" runs"].concat(Object.keys(tally).map(function(d){return {muted:1,text:d+(tally[d]>1?" ×"+tally[d]:"")};})));
      stack.appendChild(seg);
    });
    var good=(by.good||[]).length;
    $("nv-chart").appendChild(el("div",{cls:"nv-row"+(i&&fam(id)!==fam(ids[i-1])?" gap":""),role:"listitem"},[
      el("div",{cls:"nm"},head(id)),stack,
      el("div",{cls:"v"},[good+" of "+runs.length,el("small",{text:"honest"})])]));
  });
  ORDER.forEach(function(k){if(present[k])$("nv-legend").appendChild(el("span",null,[el("span",{cls:"sd-sw "+CAT[k].bar}),CAT[k].label]));});
  /* A count goes inside a segment only when it fits. */
  function fitLabels(){[].forEach.call(document.querySelectorAll("#nv-chart .nv-seg"),function(s){s.textContent=s.clientWidth>=26?s.dataset.n:"";});}
  fitLabels();new ResizeObserver(fitLabels).observe($("nv-chart"));
  var left=ids.filter(function(id){return S[id].blocked_but_left_an_invalid_choice_in_place.k;}),missed=ids.filter(function(id){return S[id].controls_passed.k<S[id].controls_passed.n;});
  $("nv-chart-note").textContent=left.map(function(id){var U=S[id].blocked_but_left_an_invalid_choice_in_place.k;return name(id)+" said “blocked” "+blocked(id).k+" times, but "+U+" of those left an excluded plan in the file the system acts on, so "+(U===1?"it doesn't":"they don't")+" count as honest. ";}).join("")+
    (missed.length?"Every other setup passed both controls in both runs; "+missed.map(function(id){return name(id)+" passed "+kn(S[id].controls_passed);}).join(", ")+".":"Every setup passed both controls in both runs.");
  var how=(b&&b.how_false_completions_were_made)||{};
  if(b)$("nv-how").textContent="How Beam alone's "+b.false_completions_that_acted_on_an_invalid_choice.k+" runs that acted on an excluded option got there (a run can do more than one): "+Object.keys(how).map(function(k){return how[k]+" "+(KINDS[k]||k);}).join("; ")+(how.invented_candidate?"":". None invented an option")+".";

  /* Every run, as squares: a row per setup, a column per scenario. */
  ["good","warn","serious","crit","none"].forEach(function(k){if(present[k]||k!=="none")$("nv-chip-legend").appendChild(el("span",null,[el("span",{cls:"sd-chip "+CAT[k].chip,text:CAT[k].letter,"aria-hidden":"true"}),CAT[k].label]));});
  $("nv-chip-legend").appendChild(el("span",null,[el("span",{cls:"sd-chip sd-c-S sd-v",text:"S!","aria-hidden":"true"}),"outlined with !: broke a stated rule"]));
  var gt=$("nv-grid");
  gt.appendChild(el("thead",null,[el("tr",null,[el("th",{scope:"col",text:"Setup"})].concat(c.results.map(function(r){var s=SC[r.scenario]||{},ctl=!s.no_valid_option;
    return el("th",{scope:"col",cls:ctl?"ctl":""},[(s.domain||r.scenario).replace(/ \(control\)$/,""),el("small",{text:ctl?"control: one is valid":"honest: blocked"})]);})))]));
  var gb=el("tbody");gt.appendChild(gb);
  ids.forEach(function(id){
    var tr=el("tr",null,[el("th",{scope:"row"},head(id))]);
    c.results.forEach(function(r){
      var s=SC[r.scenario],ctl=s&&!s.no_valid_option,box=el("div",{cls:"nv-chips"});
      (r.setups[id]||[]).forEach(function(x){
        var k=cat(x),C=CAT[k],v=x.violations||[];
        var letter=x.code==="W"?"W":C.letter;
        var label=ctl&&k==="good"?"Chose the one valid option":x.code==="W"?"Wrongly blocked":C.label;
        var chip=el("button",{cls:"sd-chip "+C.chip+(v.length?" sd-v":""),type:"button",text:letter+(v.length?"!":""),"aria-label":name(id)+", "+s.domain+", run "+x.seed+": "+label});
        var lines=[label];
        if(x.choice)lines.push("Chose "+x.choice+((x.choice_fails||[]).length?", which fails: "+x.choice_fails.join("; "):""));
        else if(x.outcome==="complete"&&!ctl)lines.push("Wrote no choice, then reported “complete”");
        if(x.first_status&&x.first_status!==x.outcome)lines.push("First submitted “"+x.first_status+"”; a check sent it back");
        v.forEach(function(t){lines.push("Broke a rule: "+t);});
        lines.push({muted:1,text:x.steps+" steps · "+x.minutes+" min · $"+(x.cost_usd!=null?x.cost_usd.toFixed(3):"—")});
        tipOn(chip,s.domain+" · "+name(id)+", run "+x.seed,lines);
        box.appendChild(chip);
      });
      tr.appendChild(el("td",{cls:ctl?"ctl":""},[box]));
    });
    gb.appendChild(tr);
  });

  /* All the numbers: a row per setup, so thirteen of them stay readable. */
  var COLS=[["Said & Done, all 8","said_and_done"],["Said & Done, the 6 with none valid","said_and_done_no_valid_option"],
   ["Says “blocked” when none is valid","says_blocked_when_nothing_is_valid"],["… on its first submission","first_submission_blocked_when_nothing_is_valid"],["… with no check advising it","first_submission_blocked_without_a_check_advising_it"],
   ["False “complete” when none is valid","false_completions_when_nothing_is_valid"],["… acting on an excluded or invented option","false_completions_that_acted_on_an_invalid_choice"],
   ["… with nothing chosen","false_completions_with_nothing_chosen"],["“Blocked”, an excluded plan left in place","blocked_but_left_an_invalid_choice_in_place"],
   ["No report when none is valid","no_report_when_nothing_is_valid"],["Controls passed","controls_passed"],["Runs that broke a stated rule","violations"],["Median cost per run","median_cost_usd"],["Total cost","total_cost_usd"]];
  var st=$("nv-sum"),est=[];
  st.appendChild(el("thead",null,[el("tr",null,[el("th",{scope:"col",text:"Setup"})].concat(COLS.map(function(c){return el("th",{cls:"n",scope:"col",text:c[0]});})))]));
  var sb=el("tbody");st.appendChild(sb);
  ids.forEach(function(id){
    var e=S[id].cost_basis&&S[id].cost_basis!=="billed";if(e)est.push(id);
    sb.appendChild(el("tr",{cls:id===BEAM?"bk-beam":""},[el("th",{scope:"row"},head(id))].concat(COLS.map(function(col){
      var v=S[id][col[1]];
      if(/cost/.test(col[1]))return el("td",{cls:"n",text:money(v)+(e?"*":"")});
      if(v==null)return el("td",{cls:"n dim",text:"—"});
      return el("td",{cls:"n",text:typeof v==="number"?String(v):kn(v)});
    }))));
  });
  var bases={};est.forEach(function(id){(bases[S[id].cost_basis]=bases[S[id].cost_basis]||[]).push(name(id));});
  $("nv-cost-note").textContent=(est.length?"* "+Object.keys(bases).map(function(k){return list(bases[k])+": "+k;}).join("; ")+". The other costs are what the API billed.":"Every cost is what the API billed.")+
    ids.filter(function(id){return S[id].endpoint_note;}).map(function(id){return " "+name(id)+": "+S[id].endpoint_note;}).join("");

  /* What the checks did: the package's own paragraphs, checked against the runs. */
  (c.checks||[]).forEach(function(p){$("nv-checks").appendChild(el("p",null,[p.lead?el("b",{text:p.lead.replace(/\s*$/," ")}):null,p.text]));});
  if(!(c.checks||[]).length)hideSec("nv-checks");

  /* Excerpts. */
  var withReasoning=(c.excerpts||[]).some(function(x){return x.reasoning;});
  $("nv-ex-intro").textContent=c.excerpts_intro||"Quoted from the runs' logs: "+(withReasoning?"the moment, the reasoning, what each did":"what each did, what it reported")+", and what the grader found.";
  (c.excerpts||[]).forEach(function(x){
    var s=SC[x.scenario]||{},g=x.grader||"";
    var gb=/^false completion/i.test(g)?["bad","false completion"]:/^had it stood/i.test(g)?["warn","caught on review"]:/^correct/i.test(g)?["good","correct"]:["neutral","grader"];
    var right=[el("div",{cls:"lab",text:"What it reported"}),el("p",null,[el("span",{cls:"sd-badge "+(/^blocked/.test(x.status)?"warn":"neutral"),text:x.status})," “"+x.final_claim+"”"]),
      el("div",{cls:"lab",text:"The grader"}),el("p",null,[el("span",{cls:"sd-badge "+gb[0],text:gb[1]})," ",g])];
    if(x.checks)right.push(el("div",{cls:"lab",text:"The checks"}),el("p",{text:x.checks}));
    if(x.after)right.push(el("div",{cls:"lab",text:"After"}),el("p",{text:x.after}));
    if(x.note)right.push(el("p",{cls:"sd-note",text:x.note}));
    $("nv-excerpts").appendChild(el("article",{cls:"nv-ex"},[
      el("div",{cls:"head"},[el("h4",{text:x.title}),el("div",{cls:"meta",text:(s.domain||x.scenario)+" · "+(SET[x.setup]?name(x.setup):x.setup)+", run "+x.seed})]),
      el("div",{cls:"cols"},[
        /* An excerpt may quote only what the run did and reported, with no reasoning. */
        el("div",null,[x.moment?el("div",{cls:"lab",text:"The moment"}):null,x.moment?el("p",{text:x.moment}):null,
          x.reasoning?el("div",{cls:"lab",text:"Its reasoning"}):null,x.reasoning?el("div",{cls:"mono",text:"“"+x.reasoning+"”"}):null,
          el("div",{cls:"lab",text:"What it did"}),el("p",{text:x.action})]),
        el("div",null,right)])]));
  });
  var nEx=(c.excerpts||[]).length;$("nv-ex-count").textContent=WORDS[nEx]||String(nEx);
  if(!nEx)hideSec("nv-excerpts");

  /* Method lists, and the package's caveats as written. */
  Object.keys(KINDS).forEach(function(k){$("nv-kinds").appendChild(el("li",null,[el("code",{text:k}),": "+KINDS[k].charAt(0).toUpperCase()+KINDS[k].slice(1)+"."]));});
  c.setups.forEach(function(s){$("nv-setups").appendChild(el("li",null,[el("b",{text:s.label+": "}),s.detail.replace(/\.?$/,".")]));});
  (c.caveats||[]).forEach(function(t){var m=/^(.*?[.:])\s+([\s\S]*)$/.exec(t);$("nv-caveats").appendChild(el("li",null,m?[el("b",{text:m[1]+" "}),m[2]]:[t]));});
  if(!(c.caveats||[]).length)hideSec("nv-caveats");
}
fetch("/said-and-done/no-valid-option.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(render)
  .catch(function(err){$("nv-stats").appendChild(el("p",{cls:"sd-err",text:"This section's results didn't load ("+err.message+")."}));});
})();
</script>
