{{ define "main" }}
<article class="ph3 ph4-ns pv3">
  <div style="max-width:42rem;margin:0 auto">
    <h1 class="f1 lh-title mb2">{{ .Title }}</h1>
    <div class="nested-copy-line-height nested-links">{{ .Content }}</div>
  </div>
</article>

<div style="max-width:1180px;margin:0 auto 3rem;padding:0 1rem">
  <iframe id="drillFrame" src="/demos/blunder-drill.html" title="Blunder drill"
          loading="lazy"
          style="display:block;width:100%;border:0;border-radius:10px;height:1200px"></iframe>
  <p style="max-width:42rem;margin:1rem auto 0;color:#666;font-size:.9rem">
    Nothing is saved &mdash; reload for a fresh run.
  </p>
</div>

<script>
(function () {
  // The demo reports its own height so the frame never grows an inner
  // scrollbar. Only messages coming from this iframe's window are trusted.
  var f = document.getElementById("drillFrame");
  if (!f) return;
  window.addEventListener("message", function (e) {
    if (!f.contentWindow || e.source !== f.contentWindow) return;
    var h = e.data && e.data.drillHeight;
    if (typeof h === "number" && h > 200 && h < 20000) f.style.height = h + "px";
  });
})();
</script>
{{ end }}
